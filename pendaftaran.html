        <nav class="navbar navbar-expand-lg navbar-dark bg-primary fixed-top">
            <div class="container">
                <a class="navbar-brand fw-bold" href="index.html">Fauzan Academy</a>

                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto align-items-center">
                        <li class="nav-item"><a class="nav-link" href="index.html">Beranda</a></li>

                        <li class="nav-item"><a class="nav-link" href="kontak.html">Kontak</a></li>

                            <button id="darkModeToggle" class="btn btn-sm btn-outline-light ms-lg-3">🌓 Mode</button>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main class="main-content">
        <section class="container py-5">
            <div class="row justify-content-center">
                <div class="col-xl-7 col-lg-8">
                    <div class="card card-custom shadow-sm">
                        <div class="card-body p-5">
                            <div class="text-center mb-4">
                                <h2>Pendaftaran Peserta Baru</h2>
                            </div>
                            <form id="registrationForm" action="backend/proses_daftar.php" method="post">
                                <div class="mb-3">
                                    <label for="nama" class="form-label">Nama Lengkap</label>
                                    <input type="text" class="form-control" id="nama" name="nama" placeholder="Nama Lengkap" required>
                                </div>
                                <div class="mb-3">
                                    <label for="email" class="form-label">Email</label>
                                    <input type="email" class="form-control" id="email" name="email" placeholder="Email" required>
                                </div>
                                <div class="mb-3">
                                    <label for="hp" class="form-label">Nomor HP</label>
                                    <input type="tel" class="form-control" id="hp" name="hp" placeholder="Nomor HP" required>
                                </div>
                                <div class="mb-3">
                                    <label for="program" class="form-label">Program Pelatihan</label>
                                    <select class="form-select" id="program" name="program" required>
                                        <option value="">-- Pilih Program --</option>
                                        <option>Junior Web Programming</option>
                                        <option>Data Analyst</option>
                                        <option>UI/UX Designer</option>
                                        <option>IT Auditor</option>
                                        <option>Digital Marketing</option>
                                        <option>Cyber Security</option>
                                    </select>
                                </div>
                                <div class="mb-4">
                                    <label for="alamat" class="form-label">Alamat</label>
                                    <textarea class="form-control" id="alamat" name="alamat" placeholder="Alamat" required></textarea>
                                </div>
                                <button type="submit" class="btn btn-primary w-100">Daftar Sekarang</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <div class="modal fade" id="registrationSuccessModal" tabindex="-1" aria-labelledby="registrationSuccessModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h1 class="modal-title fs-5" id="registrationSuccessModalLabel">Pendaftaran Berhasil</h1>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Tutup"></button>
                </div>
                <div class="modal-body">
                    Terima kasih, pendaftaran Anda telah berhasil terkirim. Tim kami akan segera menghubungi Anda.
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-primary" data-bs-dismiss="modal">Tutup</button>
                </div>
            </div>
        </div>
    </div>
